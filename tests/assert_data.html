<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>霞客经纬 · 数据断言</title>
<style>
body{font-family:KaiTi,serif;background:#3d2620;color:#f2ede0;padding:24px;line-height:1.8}
h2{font-weight:400;letter-spacing:4px;border-bottom:1px solid #c25b4e;padding-bottom:6px}
.pass{color:#9fae8d}.fail{color:#e08a7e;font-weight:bold}
li{list-style:none;margin:4px 0}
</style>
</head>
<body>
<h2>数据断言 · 霞客经纬</h2>
<ul id="out"></ul>
<script src="../data/trip_data.js?v=15"></script>
<script src="../data/xref_fy.js?v=15"></script>
<script>
const out = document.getElementById("out");
let n = 0, bad = 0;
function assert(cond, label) {
  n++;
  const li = document.createElement("li");
  li.textContent = (cond ? "✓ " : "✗ ") + label;
  li.className = cond ? "pass" : "fail";
  if (!cond) bad++;
  out.appendChild(li);
}
assert(XXK.meta.pieces === 52, `游程 ${XXK.meta.pieces} = 52（三源）`);
const nGx = XXK.trips.filter(t => t.source === "gx").length;
const nKr = XXK.trips.filter(t => t.source === "kr").length;
const nWs = XXK.trips.filter(t => t.source === "ws").length;
assert(nGx === 22 && nKr === 21 && nWs === 9, `三源构成 gx${nGx}+kr${nKr}+ws${nWs} = 52`);
const wsAnc = XXK.trips.filter(t => t.source === "ws").reduce((a, t) => a + t.stats.anchored, 0);
assert(wsAnc === 0, `ws 附编零锚（实际 ${wsAnc}——考体文不设锚）`);
assert(XXK.meta.days >= 900, `日条 ${XXK.meta.days} ≥ 900`);
assert(XXK.meta.anchored >= 450, `锚定 ${XXK.meta.anchored} ≥ 450`);
assert(XXK.meta.coverage >= 50, `锚覆盖率 ${XXK.meta.coverage}% ≥ 50%`);
assert(XXK.meta.kmTotal >= 10000, `可信里程 ${XXK.meta.kmTotal} ≥ 10000 km`);
assert(XXK.meta.gazetteer >= 350, `地名表 ${XXK.meta.gazetteer} ≥ 350`);
assert(XXK.meta.confQu > XXK.meta.confTui, `确 ${XXK.meta.confQu} > 推 ${XXK.meta.confTui}`);
assert(XXK.meta.charsOrig >= 400000 && XXK.meta.charsOrig <= 500000,
       `原文字数 ${XXK.meta.charsOrig} 在 40-50 万`);
const jumps = XXK.trips.reduce((a, t) => a + t.days.filter(d => d.jump).length, 0);
assert(jumps <= 4, `跳段 ${jumps} ≤ 4`);
const krKm = XXK.trips.filter(t => t.source === "kr").reduce((a, t) => a + t.stats.km, 0);
assert(krKm > 8000, `滇黔补编里程贡献 ${krKm} km > 8000`);
const withPath = XXK.trips.filter(t => t.path.length >= 2);
assert(withPath.length >= 38, `成线游程 ${withPath.length} ≥ 38（附记/杂著单日不成线）`);
const t1 = XXK.trips[0];
assert(t1.title === "游天台山日记" && t1.year0 === 1613, "首程 = 游天台山日记 1613");
const t22 = XXK.trips[21];
assert(t22.num === "021" && t22.stats.days > 50, "t22 = 粤西游日记二（长程）");
const t43 = XXK.trips[42];
assert(t43.num === "042" && t43.title === "记游颜洞" && t43.source === "kr",
       "t43 = 记游颜洞（kr 附记）");
const t52 = XXK.trips[51];
assert(t52.num === "051" && t52.title === "丽江纪略" && t52.source === "ws",
       "末篇 = 丽江纪略（ws 杂著）");
const t25 = XXK.trips[24];
assert(t25.title === "黔游日记一" && t25.source === "kr", "t25 = 黔游日记一（kr）");
// 编年单调（纲目序；附记三篇为无年散文，挂尾不参序）
let mono = true;
const diaries = XXK.trips.filter(t => t.num < "040");   // 附编（040+）挂尾不参编年序
for (let i = 1; i < diaries.length; i++)
  if (diaries[i].year0 < diaries[i - 1].year0) mono = false;
assert(mono, "日记诸篇按编年有序（附记除外）");
// 每锚点有 src/依据/置信
let okAnchor = true, checked = 0;
XXK.trips.forEach(t => t.days.forEach(d => {
  if (d.anchor) {
    checked++;
    if (!d.anchor.src || !d.anchor.basis || !d.anchor.conf || !d.anchor.today) okAnchor = false;
  }
}));
assert(okAnchor && checked === XXK.meta.anchored,
       `全部 ${checked} 锚点带 src/basis/conf/today 字段`);
// ── P2 · 方舆互查桥（data/xref_fy.js，tools/build_xref_fy.py 产物） ──
const X = window.XXK_FYXREF;
assert(X && X.total === XXK.meta.anchored, `互查桥锚数 ${X && X.total} = 锚定 ${XXK.meta.anchored}`);
assert(X && X.matched + X.unmatched === X.total, `匹配 ${X.matched} + 无对应 ${X.unmatched} = 总 ${X.total}`);
assert(X && X.matched > X.total * 0.4, `匹配率 ${Math.round(X.matched / X.total * 100)}% > 40%（如实下限）`);
assert(X && X.byTrip.length === 52, `按篇分组 ${X.byTrip.length} = 52`);
const nSum = X.byTrip.reduce((a, t) => a + t.matched + t.unmatched, 0);
assert(nSum === X.total, `分组计数和 ${nSum} = 总 ${X.total}`);
const exOK = X.byTrip.some(t => t.examples.length &&
  t.examples.every(e => e.href.startsWith("../HHH/#mode=") && e.fyFu && e.ctx));
assert(exOK, "样例带原文句 + 方舆府县 + ../HHH/ 深链");
assert(X.uniqMatched <= X.uniqNames && X.uniqNames > 100, `唯一地名 ${X.uniqMatched}/${X.uniqNames}`);
const title = bad === 0 ? `PASS (${n})` : `FAIL (${bad}/${n})`;
document.title = title;
const li = document.createElement("li");
li.textContent = `—— ${title}`;
li.className = bad === 0 ? "pass" : "fail";
out.appendChild(li);
</script>
</body>
</html>
